<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CYX DayZ 启动器</title>
  <meta name="description" content="CYX DayZ 玩家启动器公开下载与自动更新镜像">
  <style>
    :root { color-scheme: dark; --bg:#0b1118; --panel:#121c27; --line:#263647; --text:#e9f2fb; --muted:#9fb0c2; --blue:#2f81f7; --green:#34d399; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:"Microsoft YaHei",system-ui,sans-serif; background:radial-gradient(circle at 15% 15%,#16314d 0,transparent 32%),var(--bg); color:var(--text); display:grid; place-items:center; padding:24px; }
    main { width:min(900px,100%); background:rgba(18,28,39,.94); border:1px solid var(--line); border-radius:22px; padding:clamp(28px,5vw,58px); box-shadow:0 28px 80px rgba(0,0,0,.35); }
    .tag { color:var(--green); font-weight:700; letter-spacing:.08em; }
    h1 { font-size:clamp(36px,7vw,68px); line-height:1.05; margin:18px 0; }
    p { color:var(--muted); font-size:18px; line-height:1.75; }
    .version { display:inline-flex; gap:10px; align-items:center; border:1px solid var(--line); border-radius:999px; padding:8px 14px; color:#cde4ff; }
    .dot { width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 16px var(--green); }
    .actions { display:flex; flex-wrap:wrap; gap:14px; margin:32px 0 22px; }
    button,a.button { border:0; border-radius:12px; padding:15px 22px; font:inherit; font-weight:700; cursor:pointer; text-decoration:none; }
    button { background:var(--blue); color:white; }
    button:disabled { opacity:.58; cursor:wait; }
    a.button { color:var(--text); border:1px solid var(--line); background:#172331; }
    #status { min-height:30px; color:#b9d4ef; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-top:28px; }
    .card { border:1px solid var(--line); border-radius:14px; padding:18px; color:var(--muted); }
    .card strong { color:var(--text); display:block; margin-bottom:7px; }
  </style>
</head>
<body>
  <main>
    <div class="tag">CYX · DAYZ LAUNCHER</div>
    <h1>一键对齐模组，<br>快速进入服务器。</h1>
    <p>GitHub 公共镜像，无需登录。安装包会按更新清单下载已校验分片并在浏览器内自动合并。</p>
    <div class="version"><span class="dot"></span> 最新版 v1.3.0</div>
    <div class="actions">
      <button id="download">下载 v1.3.0 安装包</button>
      <a class="button" href="CYX_DayZ_PlayerLauncher_v1.3.0_Source.zip">下载源码</a>
      <a class="button" href="https://github.com/Axiao24321/CYX-DayZ-Launcher">查看 GitHub 仓库</a>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <div class="grid">
      <div class="card"><strong>公共更新源</strong>GitHub Pages 无需登录即可检查并下载更新。</div>
      <div class="card"><strong>签名与完整性</strong>清单验证 Ed25519 签名，分片和完整安装包验证 SHA-256。</div>
      <div class="card"><strong>Steam 增量更新</strong>只把确认过期的模组交给 Steam 修复。</div>
    </div>
  </main>
  <script>
    const button = document.querySelector("#download");
    const status = document.querySelector("#status");
    const updatePublicKey = "yFMtRlOKBLJYkP6Y+vU1Y+9oOPl3MrPIvaaBmGWbtA0=";
    const expectedKeyId = "cyx-update-2026-01";
    const fromBase64 = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
    const toHex = buffer => [...new Uint8Array(buffer)].map(value => value.toString(16).padStart(2, "0")).join("");
    const sortedValue = value => {
      if (Array.isArray(value)) return value.map(sortedValue);
      if (value && typeof value === "object") {
        return Object.keys(value).sort().reduce((result, key) => {
          result[key] = sortedValue(value[key]);
          return result;
        }, {});
      }
      return value;
    };
    const verifyManifest = async manifest => {
      const signature = manifest.signature;
      if (!signature || signature.algorithm !== "ed25519" || signature.key_id !== expectedKeyId) {
        throw new Error("更新清单签名无效");
      }
      const unsigned = {...manifest};
      delete unsigned.signature;
      const payload = new TextEncoder().encode(JSON.stringify(sortedValue(unsigned)));
      const publicKey = await crypto.subtle.importKey(
        "raw",
        fromBase64(updatePublicKey),
        {name:"Ed25519"},
        false,
        ["verify"]
      );
      const valid = await crypto.subtle.verify(
        {name:"Ed25519"},
        publicKey,
        fromBase64(signature.value),
        payload
      );
      if (!valid) throw new Error("更新清单签名校验失败");
    };
    const sha256Hex = async buffer => toHex(await crypto.subtle.digest("SHA-256", buffer));
    button.addEventListener("click", async () => {
      button.disabled = true;
      const chunks = [];
      let received = 0;
      try {
        status.textContent = "正在读取更新清单…";
        const manifestResponse = await fetch(`latest.json?t=${Date.now()}`, {cache:"no-store"});
        if (!manifestResponse.ok) throw new Error(`清单 HTTP ${manifestResponse.status}`);
        const manifest = await manifestResponse.json();
        await verifyManifest(manifest);
        const parts = manifest.parts;
        for (let i = 0; i < parts.length; i++) {
          status.textContent = `正在下载分片 ${i + 1}/${parts.length}…`;
          const response = await fetch(parts[i].url, {cache:"no-store"});
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const chunk = await response.arrayBuffer();
          if (chunk.byteLength !== parts[i].size || await sha256Hex(chunk) !== parts[i].sha256) {
            throw new Error(`分片 ${i + 1} 完整性校验失败`);
          }
          received += chunk.byteLength;
          chunks.push(chunk);
        }
        status.textContent = `已合并 ${(received / 1048576).toFixed(1)} MB，正在校验完整安装包…`;
        const blob = new Blob(chunks, {type:"application/vnd.microsoft.portable-executable"});
        if (received !== manifest.size || await sha256Hex(await blob.arrayBuffer()) !== manifest.sha256) {
          throw new Error("完整安装包校验失败");
        }
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `CYX_Dayz_Launcher_v${manifest.version}_Setup.exe`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
        status.textContent = "安装包已下载，请运行安装。";
      } catch (error) {
        status.textContent = `下载失败：${error.message}，请稍后重试。`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
